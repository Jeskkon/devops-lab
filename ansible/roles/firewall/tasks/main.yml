- name: install firewalld
  ansible.builtin.apt:
    name: firewalld
    state: present
    update_cache: true

- name: start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: open SSH port
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    state: enabled
    immediate: true
